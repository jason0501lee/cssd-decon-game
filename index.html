<title>去污區收件窗口</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* Layout: 單一 16:9 像素畫框；病房治療盤包流程 窗口 → Worktable（逐件分類、清單打勾、丟垃圾、串器械）→ Workbench（水槽浸泡藥水 → 刷子刷洗）；Workstation 暫不開放；按鈕、送件單、放大檢視都疊在框內 */
:root {
  --ink: #0e1215;
  --frame: #2a3238;
  --paper: #ece8dc;
  --paper-ink: #26282a;
  --text: #e3e8ea;
  --muted: #9aa5ac;
  --amber: #f2c14e;
  --ok: #5fd08a;
  --bad: #ff6b6b;
  --plate: #3a434a;
  --plate-hi: #59646c;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--f-body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px; display: grid; place-items: center; user-select: none; -webkit-user-select: none;
}
.stage {
  position: relative; width: min(100%, calc((100vh - 40px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 1440px;
  border: 3px solid #000; box-shadow: 0 0 0 3px var(--frame), 0 12px 40px rgba(0,0,0,.6); overflow: hidden; container-type: inline-size;
}
canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; display: block; }
.ui { position: absolute; font-size: clamp(10px, 1.45cqw, 17px); line-height: 1.35; }
.hud { left: 1.2%; top: 2%; display: flex; gap: .9em; font-family: var(--f-pixel); font-size: clamp(9px, 1.25cqw, 15px); background: rgba(14,18,21,.78); padding: .3em .7em; border: 1px solid #000; font-variant-numeric: tabular-nums; pointer-events: none; }
.hud b { font-weight: 400; color: var(--amber); }
.hint { left: 1.2%; top: 9%; max-width: 46%; color: var(--amber); background: rgba(14,18,21,.85); border: 1px solid var(--amber); padding: .3em .9em; pointer-events: none; }
.toast { left: 50%; transform: translateX(-50%); bottom: 4%; padding: .45em 1em; border: 2px solid; background: rgba(14,18,21,.94); pointer-events: none; transition: opacity .25s; max-width: 80%; text-align: center; }
.toast.ok { color: var(--ok); border-color: var(--ok); } .toast.bad { color: var(--bad); border-color: var(--bad); } .toast.info { color: var(--text); border-color: var(--muted); }
.plate {
  font: inherit; font-family: var(--f-pixel); color: var(--text); cursor: pointer; text-align: left;
  background: linear-gradient(var(--plate-hi), var(--plate)); border: 2px solid #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 0 #000;
  padding: .3em .6em; display: grid; gap: .05em; letter-spacing: .04em;
}
.plate small { font-family: var(--f-body); font-size: .85em; color: var(--muted); letter-spacing: 0; }
.plate:hover, .plate:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; color: var(--amber); }
.plate[aria-current="true"] { display: none; }
.wall { display: grid; gap: .35em; }
.nav { right: 30.5%; top: 2%; display: flex; gap: .4em; }
.stage[data-view="station"] .nav { right: 1.2%; }
.stage[data-view="cart"] .nav { right: 1.2%; flex-direction: column; align-items: flex-end; }
.nav .plate { padding: .22em .5em; }
.paper {
  left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1deg); width: min(56%, 520px); max-height: 86%; overflow: auto;
  background: var(--paper); color: var(--paper-ink); padding: 1.1em 1.3em 1.2em; box-shadow: 6px 6px 0 #000; border: 2px solid #000;
}
.paper::before { content: ""; position: absolute; inset: 0 0 auto; height: 6px; background: repeating-linear-gradient(90deg, #b9b3a2 0 6px, transparent 6px 12px); }
.paper .code { font-family: var(--f-pixel); font-size: .8em; color: #6b665a; letter-spacing: .06em; }
.paper h2 { margin: .25em 0 .2em; font-size: 1.15em; }
.paper .msg { margin: .5em 0 .7em; padding: .45em .7em; background: #fff8e6; border-left: 3px solid #c48a1a; }
.paper table { width: 100%; border-collapse: collapse; color: var(--paper-ink); font: inherit; font-variant-numeric: tabular-nums; }
.paper td { padding: .12em 0; border-bottom: 1px dotted #b9b3a2; } .paper td:last-child { text-align: right; width: 3em; }
.paper .rules { margin-top: .6em; font-size: .88em; color: #555; }
.paper .close { position: absolute; right: .6em; top: .5em; font: inherit; background: none; border: 0; cursor: pointer; color: #555; font-size: 1.2em; }
.paper .close:focus-visible { outline: 2px solid #c48a1a; }
.panel { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(62%, 600px); background: #1b2227; border: 2px solid #000; box-shadow: 0 0 0 2px var(--frame), 6px 6px 0 #000; padding: 1em 1.2em; max-height: 86%; overflow: auto; }
.panel h3 { margin: 0 0 .4em; font-size: 1.1em; }
.btn { font: inherit; color: var(--ink); background: var(--amber); border: 2px solid #000; padding: .35em .9em; cursor: pointer; box-shadow: 3px 3px 0 #000; }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; } .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.counter { left: 1.2%; bottom: 3%; background: rgba(14,18,21,.85); border: 1px solid #000; padding: .3em .7em; font-variant-numeric: tabular-nums; }
.finish, .check { right: 1.2%; bottom: 3%; }
.stage[data-view="table"] .check { right: 29%; }
.zoomcap { left: 50%; transform: translateX(-50%); bottom: 6%; background: rgba(14,18,21,.92); border: 1px solid var(--muted); padding: .35em 1em; text-align: center; pointer-events: none; max-width: 80%; }
.zoomcap small { color: var(--muted); display: block; }
.checklist { left: calc(4 / 320 * 100%); top: calc(30 / 180 * 100%); width: calc(70 / 320 * 100%); height: calc(138 / 180 * 100%); overflow: auto;
  background: var(--paper); color: var(--paper-ink); border: 2px solid #000; box-shadow: 3px 3px 0 #000; font-size: clamp(9px, 1.05cqw, 13px); padding: .35em .4em; box-sizing: border-box; }
.checklist h4 { margin: 0 0 .25em; font-size: 1em; border-bottom: 2px solid #26282a; padding-bottom: .15em; }
.checklist h4 small { display: block; font-weight: 400; color: #6b665a; font-size: .85em; }
.checklist .row { display: grid; grid-template-columns: 1.2em 1fr auto; gap: .3em; padding: .18em .1em; border-bottom: 1px dotted #b9b3a2; font-variant-numeric: tabular-nums; }
.checklist .row.done { color: #1d5a32; }
.checklist .box { width: 1em; height: 1em; border: 2px solid #26282a; display: grid; place-items: center; font-weight: 700; line-height: 1; color: #1d7a3e; background: #fff; }
.checklist .fold { float: right; font: inherit; font-size: 1.1em; line-height: 1; background: #26282a; color: #fff; border: 0; width: 1.4em; height: 1.4em; cursor: pointer; margin: 0 0 .2em .3em; }
.checklist .fold:hover, .checklist .fold:focus-visible { background: #c48a1a; outline: none; }
.checklist.collapsed { height: auto; overflow: visible; }
.checklist.collapsed .row, .checklist.collapsed .note { display: none; }
.checklist.collapsed h4 { border: 0; margin: 0; padding: 0; }
.checklist .note { margin-top: .35em; color: #6b665a; font-size: .85em; }
.boxtag { font-size: clamp(8px, 1cqw, 12px); background: #26282a; color: #fff; padding: .05em .45em; border: 1px solid #000; pointer-events: none; }
.poptag { background: rgba(14,18,21,.8); color: var(--muted); }
.soakclock { left: calc(247 / 320 * 100%); top: calc(14 / 180 * 100%); transform: translateX(-50%); font-family: var(--f-pixel); font-size: clamp(8px, 1.05cqw, 13px); color: #7fd3e6; background: rgba(14,18,21,.85); border: 1px solid #7fd3e6; padding: .1em .5em; pointer-events: none; white-space: nowrap; }
.scrubtag { transform: translate(-50%, -100%); font-size: clamp(8px, 1cqw, 12px); color: var(--ok); background: rgba(14,18,21,.88); border: 1px solid var(--ok); padding: .05em .45em; pointer-events: none; white-space: nowrap; }
.boxtag .stash { margin-left: .5em; color: #b9c2c8; }
.boxtag kbd, .tutor kbd { font-family: var(--f-pixel); font-size: .9em; background: var(--amber); color: var(--ink); padding: 0 .3em; border: 1px solid #000; }
.errcard { transform: translate(-50%, -110%); max-width: 34%; background: #2a1416; color: #ffd9d9; border: 2px solid var(--bad); box-shadow: 3px 3px 0 #000; padding: .35em .7em; font-size: clamp(9px, 1.2cqw, 15px); pointer-events: none; z-index: 5; }
.errcard b { display: block; color: var(--bad); font-family: var(--f-pixel); font-weight: 400; }
.errcard.show { animation: pop .18s ease-out; }
@keyframes pop { from { transform: translate(-50%, -90%) scale(.85); opacity: 0; } to { transform: translate(-50%, -110%) scale(1); opacity: 1; } }
.tutor { width: min(52%, 520px); }
.tutor .step { font-family: var(--f-pixel); color: var(--muted); font-size: .8em; }
.tutor h3 { margin: .2em 0 .3em; color: var(--amber); }
.tutor p { margin: 0; line-height: 1.6; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--muted); }
.hintbtn { left: 25%; top: 2%; padding: .2em .7em; font-size: clamp(9px, 1.2cqw, 14px); }
.stage:has(.zoomcap.live:not([hidden])) .toast { bottom: auto; top: 16%; }
.zoomcap.live { pointer-events: auto; bottom: 3%; min-width: 46%; }
.zoomcap b { color: var(--amber); }
.insp-btns { display: flex; gap: .4em; justify-content: center; margin: .35em 0 .25em; flex-wrap: wrap; }
.insp-btns button { font: inherit; font-size: .9em; background: var(--plate); color: var(--text); border: 1px solid #000; padding: .15em .6em; cursor: pointer; }
.insp-btns button:hover, .insp-btns button:focus-visible { background: var(--plate-hi); outline: 1px solid var(--amber); }
.insp-out { color: #cfe8d6; font-size: .92em; min-height: 1.3em; }
.tutor ul.tips { margin: .5em 0 0; padding-left: 1.2em; line-height: 1.55; }
.hud b.neg { color: var(--bad); }
.cartpanel { left: 1.5%; top: 15%; width: 41%; font-size: clamp(9px, 1.15cqw, 14px); pointer-events: none; }
.cartpanel b { color: var(--amber); font-size: 1.1em; } .cartpanel small { display: block; color: var(--muted); }
.cartpanel .hand { margin-top: .5em; color: var(--text); }
.cartq { left: 1.5%; top: 71%; width: 42%; color: var(--muted); font-size: clamp(8px, 1cqw, 12px); pointer-events: none; }
.cartq kbd { font-family: var(--f-pixel); background: var(--amber); color: var(--ink); padding: 0 .3em; border: 1px solid #000; }
.cartpanel .meter { position: relative; margin-top: .4em; height: 1.2em; background: #11161a; border: 1px solid #000; }
.cartpanel .meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2f8f55, #5fd08a); }
.cartpanel .meter span { position: relative; padding-left: .4em; font-size: .85em; }
.runcart { right: 1.2%; bottom: 3%; }
.stage[data-view="cart"] .finish { right: 1.2%; bottom: 12%; }
.bill { margin: .4em 0; padding: .4em .6em; background: #11161a; border: 1px solid #333; line-height: 1.6; }
.detailcap { bottom: 3%; }
.insp-btns button.on { background: var(--amber); color: var(--ink); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: #000; color: var(--text); font-size: 12px; padding: 3px 8px; border: 1px solid var(--frame); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .errcard.show { animation: none; } }
</style>

<div class="stage" id="stage">
  <canvas id="scene" width="320" height="180" aria-label="去污區像素場景"></canvas>

  <div class="ui hud" aria-live="polite">💰 <b id="sCash">NT$0</b> 錯誤 <b id="sBad">0</b><b id="sOk" hidden>0</b></div>
  <button class="ui btn hintbtn" id="hintBtn" type="button" title="依目前步驟給提示">💡 提示</button>
  <div class="ui hint" id="hint">點窗戶開窗收件</div>

  <!-- 窗口畫面：牆上的切換鈕 -->
  <div class="ui wall" id="wall">
    <button class="plate" type="button" data-go="table">WORKTABLE<small>分類・清點打勾・丟垃圾・串器械</small></button>
    <button class="plate" type="button" data-go="bench">WORKBENCH<small>浸泡・刷洗</small></button>
  </div>
  <nav class="ui nav" id="nav" hidden>
    <button class="plate" type="button" data-go="window">窗口</button>
    <button class="plate" type="button" data-go="table">WORKTABLE</button>
    <button class="plate" type="button" data-go="bench">WORKBENCH</button>
    <button class="plate" type="button" data-go="cart" hidden>STERICART</button>
  </nav>

  <div class="ui counter" id="counter" hidden></div>
  <div class="ui checklist" id="checklist" hidden aria-label="清點單"></div>
  <div class="ui boxtag" id="tagTray" hidden>器械類 <kbd>1</kbd></div>
  <div class="ui boxtag" id="tagWare" hidden>器皿類 <kbd>2</kbd></div>
  <div class="ui boxtag" id="tagB3" hidden>布類 <kbd>3</kbd></div>
  <div class="ui boxtag" id="tagB4" hidden>一般 <kbd>4</kbd></div>
  <div class="ui boxtag" id="tagB5" hidden>TOXIC <kbd>5</kbd></div>
  <div class="ui boxtag" id="tagL" hidden>L ≥5吋 <kbd>L</kbd></div>
  <div class="ui boxtag" id="tagR" hidden>送修 <kbd>6</kbd></div>
  <div class="ui boxtag" id="tagS" hidden>S &lt;5吋 <kbd>S</kbd></div>
  <div class="ui errcard" id="errcard" hidden role="alert"></div>
  <div class="ui boxtag poptag" id="tagPop" hidden></div>
  <button class="ui btn check" id="check" type="button" hidden>核對清點</button>
  <div class="ui zoomcap" id="zoomcap" hidden></div>
  <div class="ui zoomcap live detailcap" id="detailcap" hidden></div>
  <div class="ui soakclock" id="soakclock" hidden></div>
  <div class="ui scrubtag" id="scrubtag" hidden></div>
  <button class="ui btn finish" id="finish" type="button" hidden>完成本盤</button>
  <button class="ui btn finish" id="toCart" type="button" hidden>完成提交 →</button>
  <div class="ui cartpanel" id="cartPanel" hidden></div>
  <div class="ui cartq" id="cartQ" hidden></div>
  <div class="ui boxtag" id="tierTop" hidden>上層</div><div class="ui boxtag" id="tierMid" hidden>中層</div><div class="ui boxtag" id="tierBot" hidden>下層</div>
  <button class="ui btn runcart" id="runCart" type="button" hidden>推進清洗機</button>

  <div class="ui paper" id="paper" hidden role="dialog" aria-label="送件單">
    <button class="close" id="paperClose" type="button" aria-label="關閉送件單">✕</button>
    <div id="paperBody"></div>
  </div>
  <div class="ui panel" id="summary" hidden role="dialog" aria-label="結果">
    <h3 id="sumTitle"></h3><div id="sumBody"></div>
    <div style="margin-top:.8em;display:flex;gap:.6em;flex-wrap:wrap"><button class="btn" id="sumNext" type="button" hidden>送到 WORKBENCH</button><button class="btn" id="sumClose" type="button">回去繼續</button><button class="btn" id="again" type="button" hidden>接下一盤</button></div>
  </div>
  <div class="ui panel tutor" id="tutor" hidden role="dialog" aria-label="操作說明">
    <div id="tutorBody"></div>
    <div style="margin-top:.8em;display:flex;gap:.6em;justify-content:flex-end"><button class="btn ghost" id="tutorSkip" type="button">略過</button><button class="btn" id="tutorNext" type="button">下一步</button></div>
  </div>
  <div class="ui toast" id="toast" style="opacity:0"></div>
</div>

  const list = items.filter(p => p.where === 'tray');

  const groups = ['L', 'S'].map(X => list.filter(p => p.it.str === X).sort((a, b) => b.w - a.w)).filter(g => g.length);
  const X0 = POP.x + 2, XMAX = 226, TOP = POP.y + 2;
  const bottomAt = (x, w) => x + w > WARE.x - 2 ? WARE.y - 3 : TRAY.y + TRAY.h - 2;
  for (let dy = 9; dy >= 4; dy--) {
    let x = X0, y = TOP, colW = 0, ok = true; const pos = new Map();
    for (const g of groups) {
      if (y > TOP) y += 6;                                          // 組與組之間留空
      for (const p of g) {
        const w = Math.max(colW, p.w);
        if (y + p.h > bottomAt(x, w)) { x += colW + 5; y = TOP; colW = 0; }
        if (x + p.w > XMAX) { ok = false; break; }
        pos.set(p, [x, y]); colW = Math.max(colW, p.w); y += dy;

    if (dy === 4) pack(list, [X0, TOP, TRAY.x + TRAY.w - 2, TRAY.y + TRAY.h - 2]);

function pack(list, area, blocked = []) {
  const [ax, ay, bx, by] = area, G = 2, cols = Math.ceil((bx - ax) / G), rows = Math.ceil((by - ay) / G);

  const mark = (x, y, w, h) => { for (let j = Math.max(0, y); j < Math.min(rows, y + h); j++) for (let i = Math.max(0, x); i < Math.min(cols, x + w); i++) occ[j * cols + i] = 1; };

  blocked.forEach(r => mark(Math.floor((r.x - ax) / G), Math.floor((r.y - ay) / G), Math.ceil(r.w / G), Math.ceil(r.h / G)));
  list.slice().sort((a, b) => b.w * b.h - a.w * a.h).forEach(p => {

  });
}

    `<div style="margin-top:.4em;color:var(--muted)">推進清洗機（getfull／sterifull）與選擇程式下一版加入。</div>`;
  $('sumNext').hidden = true; $('again').hidden = false; $('sumClose').hidden = false;
  $('summary').hidden = false;
});
$('again').addEventListener('click', () => {
  S.round++;
  items.filter(p => p.where === 'boxed').forEach(p => p.where = 'gone'); S.bills = [];
  Object.assign(S, { delivered: false, mistakes: [], panel: null, benched: false, sel: null, spread: false, levelShown: false, boxShown: false, boxTier: null, cart: null, cartBill: null, lids: { linen: false, bin_blue: false, bin_red: false } });
  for (const k of ['L', 'S']) { STR[k].list = []; STR[k].item = null; }
  items = makeProps(); sortLayers(); hud(); $('summary').hidden = true;
  if (S.winOpen) toggleWindow();
  go('window');
});

function placeTag(id, x, y) { const e = $(id); e.style.left = (x / 320 * 100) + '%'; e.style.top = (y / 180 * 100) + '%'; }
function placeWall() {
  const a = LY.buttons_area, w = $('wall');
  w.style.left = (a.x / 320 * 100) + '%'; w.style.top = (a.y / 180 * 100) + '%'; w.style.width = (a.w / 320 * 100) + '%';
  placeTag('tagTray', TRAY.x + 2, TRAY.y - 5); placeTag('tagWare', WARE.x + 2, WARE.y - 5); placeTag('tagPop', POP.x + 2, POP.y + POP.h - 7);
  placeTag('tagB3', WT.bins.linen[0] + 2, WT.bins.linen[1] - 4); placeTag('tagB4', WT.bins.bin_blue[0] + 2, WT.bins.bin_blue[1] - 4); placeTag('tagB5', WT.bins.bin_red[0] + 2, WT.bins.bin_red[1] - 4);
  placeTag('tagR', REPAIR.x + 2, REPAIR.y - 6);
  placeTag('tagL', WT.stringers.L[0] + 2, WT.stringers.L[1] - 6); placeTag('tagS', WT.stringers.S[0] + 2, WT.stringers.S[1] - 6);
}
function basketSprite(sc) {                          // 鐵絲送修籃＋紅色送修牌
  const w = 56 * sc, h = 22 * sc, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), u = sc;
  g.fillStyle = '#1b1f22'; g.fillRect(0, 3 * u, w, h - 3 * u);
  g.fillStyle = '#5c646b'; g.fillRect(u, 4 * u, w - 2 * u, h - 5 * u);
  g.fillStyle = '#8c959c'; for (let x = 3 * u; x < w - 2 * u; x += 4 * u) g.fillRect(x, 4 * u, u, h - 5 * u);
  g.fillRect(u, 12 * u, w - 2 * u, u); g.fillStyle = '#d8dde0'; g.fillRect(u, 4 * u, w - 2 * u, u);
  g.fillStyle = '#c0262d'; g.fillRect(w - 18 * u, 0, 16 * u, 8 * u); g.fillStyle = '#fff'; g.fillRect(w - 15 * u, 3 * u, 10 * u, 2 * u);
  return c;
}
function smallOf(im, s) { const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(im, 0, 0, c.width, c.height); return c; }
$('runCart').addEventListener('click', runCart);
function start() { IMG.sm_inst_basket = smallOf(IMG.tray_basket, .55); IMG.sp_inst_basket = IMG.tray_basket; IMG.sm_repair_basket = basketSprite(1); IMG.sp_repair_basket = basketSprite(4); items = makeProps(); sortLayers(); placeWall(); go('window'); hint('點窗戶開窗收件'); loop(); }

</script>
